server:
  port: 8761

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: discovery-server
  data:
    web:
      pageable:
        max-page-size: ${MAX_PAGE_SIZE:100}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

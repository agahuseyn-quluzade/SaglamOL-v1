server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: api-gateway
  data:
    web:
      pageable:
        max-page-size: ${MAX_PAGE_SIZE:100}
  cloud:
    gateway:
      routes:
        - id: iam-service
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/iam/**
        - id: user-profile-service
          uri: lb://user-profile-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/profiles/**,/api/v1/insurance-companies/**
        - id: policy-service
          uri: lb://policy-service
          predicates:
            - Path=/api/v1/policies/**,/api/v1/insurance-products/**,/api/v1/provider-contracts/**
        - id: claim-service
          uri: lb://claim-service
          predicates:
            - Path=/api/v1/claims/**
        - id: health-record-service
          uri: lb://health-record-service
          predicates:
            - Path=/api/v1/health-records/**
        - id: ai-risk-service
          uri: lb://ai-risk-service
          predicates:
            - Path=/ai-risk/**
        - id: fraud-detection-service
          uri: lb://fraud-detection-service
          predicates:
            - Path=/fraud/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/invoices/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

iam:
  jwt:
    secret: ${IAM_JWT_SECRET}

saglamol:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  gateway:
    rate-limit:
      enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 8087

spring:
  application:
    name: fraud-detection-service
  datasource:
    url: ${FRAUD_DB_URL:jdbc:postgresql://localhost:5432/fraud_db}
    username: ${FRAUD_DB_USERNAME:${POSTGRES_USER:saglamol}}
    password: ${FRAUD_DB_PASSWORD:${POSTGRES_PASSWORD:saglamol}}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

saglamol:
  security:
    internal-auth:
      enabled: true
      secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}

server:
  port: 8085

spring:
  application:
    name: health-record-service
  datasource:
    url: ${HEALTH_RECORD_DB_URL:jdbc:postgresql://localhost:5432/health_record_db}
    username: ${HEALTH_RECORD_DB_USERNAME:${POSTGRES_USER:saglamol}}
    password: ${HEALTH_RECORD_DB_PASSWORD:${POSTGRES_PASSWORD:saglamol}}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:saglamol-documents}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

saglamol:
  security:
    internal-auth:
      enabled: true
      secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}

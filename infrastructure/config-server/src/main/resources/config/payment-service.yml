server:
  port: 8089

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USERNAME:${POSTGRES_USER:saglamol}}
    password: ${PAYMENT_DB_PASSWORD:${POSTGRES_PASSWORD:saglamol}}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

payment:
  mock:
    failure-rate: ${PAYMENT_MOCK_FAILURE_RATE:0.0}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

saglamol:
  security:
    internal-auth:
      enabled: true
      secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
      public-path-prefixes: /actuator,/v3/api-docs,/swagger-ui
  clients:
    policy:
      base-url: ${POLICY_SERVICE_URL:http://localhost:8084}
    user-profile:
      base-url: ${USER_PROFILE_SERVICE_URL:http://localhost:8082}

outbox:
  topic: payment.events
  maxRetries: ${OUTBOX_MAX_RETRIES:5}
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    interval: ${OUTBOX_SCHEDULER_INTERVAL:5000}

server:
  port: 8082

spring:
  application:
    name: user-profile-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${USER_DB_USERNAME:${POSTGRES_USER:saglamol}}
    password: ${USER_DB_PASSWORD:${POSTGRES_PASSWORD:saglamol}}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

saglamol:
  security:
    internal-auth:
      enabled: true
      secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
      public-path-prefixes: /actuator,/v3/api-docs,/swagger-ui,/internal/v1

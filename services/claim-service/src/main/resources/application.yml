server:
  port: 8084

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: claim-service
  datasource:
    url: ${CLAIM_DB_URL:jdbc:postgresql://localhost:5432/claim_db}
    username: ${CLAIM_DB_USERNAME:saglamol}
    password: ${CLAIM_DB_PASSWORD:saglamol}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

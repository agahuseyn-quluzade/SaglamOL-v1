spring:
  application:
    name: notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_GROUP_ID:notification-service-group}
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: az.saglamol.common.events,az.saglamol.common.events.*
        spring.json.value.default.type: az.saglamol.common.events.EventEnvelope
        spring.json.use.type.headers: false

notification:
  retry:
    interval-ms: ${NOTIFICATION_RETRY_INTERVAL_MS:60000}

outbox:
  topic: ${NOTIFICATION_OUTBOX_TOPIC:notification.events}
  max-retries: ${OUTBOX_MAX_RETRIES:5}
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    interval: ${OUTBOX_SCHEDULER_INTERVAL:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

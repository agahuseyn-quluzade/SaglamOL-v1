spring:
  application:
    name: payment-service
  data:
    web:
      pageable:
        max-page-size: ${MAX_PAGE_SIZE:100}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${PAYMENT_KAFKA_GROUP_ID:payment-service-group}
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: az.saglamol.common.events,az.saglamol.common.events.*
        spring.json.value.default.type: az.saglamol.common.events.EventEnvelope
        spring.json.use.type.headers: false

outbox:
  topic: ${PAYMENT_OUTBOX_TOPIC:payment.events}
  max-retries: ${OUTBOX_MAX_RETRIES:5}
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    interval: ${OUTBOX_SCHEDULER_INTERVAL:5000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: health-record-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    medical-documents: ${MINIO_MEDICAL_DOCUMENTS_BUCKET:medical-documents}

saglamol:
  security:
    internal-auth:
      secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}

outbox:
  topic: ${HEALTH_RECORD_OUTBOX_TOPIC:health-record.events}
  max-retries: ${OUTBOX_MAX_RETRIES:5}
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    interval: ${OUTBOX_SCHEDULER_INTERVAL:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

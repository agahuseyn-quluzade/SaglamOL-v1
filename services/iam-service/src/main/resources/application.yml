server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: iam-service
  datasource:
    url: ${IAM_DB_URL:jdbc:postgresql://localhost:5432/iam_db}
    username: ${IAM_DB_USERNAME:saglamol}
    password: ${IAM_DB_PASSWORD:saglamol}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

outbox:
  topic: ${IAM_OUTBOX_TOPIC:iam.events}
  max-retries: ${OUTBOX_MAX_RETRIES:5}
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    interval: ${OUTBOX_SCHEDULER_INTERVAL:5000}

iam:
  jwt:
    secret: ${IAM_JWT_SECRET:dev-local-secret-change-me-dev-local-secret-change-me}
    access-token-minutes: ${IAM_ACCESS_TOKEN_MINUTES:15}
  refresh-token:
    days-to-live: ${IAM_REFRESH_TOKEN_DAYS_TO_LIVE:30}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
